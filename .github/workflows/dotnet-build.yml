name: .NET build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore LMS.sln
      - name: Build in Release mode
        run: dotnet build LMS.sln --configuration Release --no-restore
      - name: Run authentication model tests
        run: dotnet test LMS.Tests/LMS.Tests.csproj --configuration Release --verbosity normal
